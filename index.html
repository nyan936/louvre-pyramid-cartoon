<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>卢浮宫玻璃金字塔 · Pyramide du Louvre — 贝聿铭 I.M. Pei, 1989</title>
<style>
  :root{
    --ink:#f7f2e8; --ink2:rgba(247,242,232,.80); --ink3:rgba(247,242,232,.60); --ink4:rgba(247,242,232,.40);
    --glass:rgba(16,22,34,.54); --glass2:rgba(16,22,34,.32); --line:rgba(240,232,214,.14);
    --gold:#e8bb63; --gold-soft:rgba(232,187,99,.16); --gold-line:rgba(232,187,99,.55);
    --blue:#7fc4ff;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#070a12;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,8,14,.50) 0,rgba(5,8,14,.16) 18%,rgba(5,8,14,0) 34%),
               linear-gradient(0deg,rgba(5,8,14,.56) 0,rgba(5,8,14,.18) 20%,rgba(5,8,14,0) 38%)}

  /* 左上标题 */
  #brand{position:fixed;top:26px;left:32px;z-index:6;pointer-events:none;max-width:min(40vw,440px)}
  #brand::before{content:'';position:absolute;inset:-26px -50px -24px -36px;z-index:-1;border-radius:24px;
    background:radial-gradient(120% 96% at 14% 40%,rgba(4,7,13,.68) 0,rgba(4,7,13,.32) 56%,rgba(4,7,13,0) 82%)}
  #brand h1{margin:0;font-family:var(--serif);font-size:29px;font-weight:400;letter-spacing:.16em;line-height:1.12;text-shadow:0 2px 28px rgba(0,0,0,.62)}
  #brand .sub{margin-top:9px;font-size:10px;letter-spacing:.30em;color:var(--ink2);text-transform:uppercase}
  #brand .rule{width:32px;height:1px;background:var(--gold);margin:12px 0 10px;opacity:.85}
  #brand .meta{margin-top:10px;font-size:11px;line-height:1.95;letter-spacing:.04em;color:var(--ink3)}
  #brand .meta b{color:var(--ink2);font-weight:400}
  #brand .meta .k{color:var(--gold);opacity:.9}

  /* 右上 HUD */
  #hudwrap{position:fixed;top:26px;right:22px;z-index:6;text-align:right;pointer-events:none}
  #hud{font-size:11px;letter-spacing:.16em;color:var(--ink3);font-variant-numeric:tabular-nums}

  /* 右侧机位 */
  #cams{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:4px;align-items:flex-end;padding:12px 6px 12px 20px;border-radius:18px}
  #cams::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:18px;
    background:linear-gradient(90deg,rgba(4,7,13,0) 0,rgba(4,7,13,.34) 48%,rgba(4,7,13,.48) 100%)}
  #cams .cap{font-size:9px;letter-spacing:.34em;color:var(--ink4);text-transform:uppercase;margin:0 4px 6px 0}
  .cam{appearance:none;font-family:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);
    padding:6px 12px;border-radius:999px;font-size:12px;letter-spacing:.08em;transition:all .18s}
  .cam:hover{background:var(--glass2);color:var(--ink);transform:translateX(-2px)}
  .cam.on{background:var(--gold-soft);border-color:var(--gold-line);color:#ffeecb}

  /* 底部控制台 */
  #dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;width:min(1180px,calc(100vw - 44px));
    background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 18px 13px;
    backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);
    box-shadow:0 18px 54px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .32s,opacity .32s}
  #dock.hide{transform:translateX(-50%) translateY(140%);opacity:0}
  #dock .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  #dock .row + .row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(240,232,214,.08)}
  .grp{display:flex;align-items:center;gap:8px}
  .lab{font-size:9.5px;letter-spacing:.24em;color:var(--ink4);text-transform:uppercase;white-space:nowrap}
  #hourLabel{font-family:var(--serif);font-size:19px;letter-spacing:.06em;color:#ffeecb;min-width:62px;font-variant-numeric:tabular-nums}
  input[type=range]{appearance:none;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,#2b3a58,#5f7ba8 22%,#ffd08a 52%,#f09a52 66%,#31405f 80%,#1b2438)}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#fff6e2,#e8bb63);border:1px solid rgba(255,255,255,.7);box-shadow:0 0 12px rgba(232,187,99,.55)}
  #hour{width:min(46vw,420px)}
  #exposure{width:120px}
  .btn{appearance:none;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--ink2);padding:5px 11px;border-radius:999px;font-size:11.5px;letter-spacing:.06em;transition:all .16s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.10);color:var(--ink)}
  .btn.on{background:var(--gold-soft);border-color:var(--gold-line);color:#ffeecb}
  .btn.tiny{font-size:11px;padding:5px 9px}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .hint{font-size:10.5px;color:var(--ink4);letter-spacing:.04em;margin-left:auto;text-align:right;line-height:1.6}
  #expLabel{font-size:11px;color:var(--ink2);min-width:30px;font-variant-numeric:tabular-nums}

  /* 报错面板 */
  #errs{position:fixed;left:32px;bottom:110px;z-index:9;max-width:min(60vw,620px);display:none;
    background:rgba(70,12,14,.86);border:1px solid rgba(255,120,120,.5);border-radius:10px;padding:10px 13px;
    font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#ffd9d9;white-space:pre-wrap}
  @media (max-width:900px){
    #brand{max-width:64vw} #brand h1{font-size:21px}
    #cams{display:none} #hour{width:42vw}
    .hint{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="scrim"></div>

<header id="brand">
  <h1>卢浮宫玻璃金字塔</h1>
  <div class="sub">Pyramide du Louvre · Cour Napoléon, Paris</div>
  <div class="rule"></div>
  <div class="meta">
    <b>贝聿铭 I.M. Pei</b> · 大卢浮宫计划 · <b>1983–1989</b><br>
    塔高 <span class="k">21.64 m</span>　底边 <span class="k">34 m</span>　倾角 <span class="k">51.5°</span><br>
    <span class="k">603</span> 块菱形 + <span class="k">70</span> 块三角形玻璃 · 三座小金字塔 · 环绕水池
  </div>
</header>

<div id="hudwrap"><div id="hud">—</div></div>

<nav id="cams">
  <div class="cap">Cameras</div>
  <button class="cam" data-cam="hero">全景</button>
  <button class="cam" data-cam="close">贴脸</button>
  <button class="cam" data-cam="entrance">入口</button>
  <button class="cam" data-cam="axis">中轴</button>
  <button class="cam" data-cam="east">东侧</button>
  <button class="cam" data-cam="aerial">鸟瞰</button>
  <button class="cam" data-cam="sky">星空</button>
  <button class="cam" data-cam="ridge">屋脊</button>
</nav>

<div id="dock">
  <div class="row">
    <div class="grp">
      <span class="lab">时刻</span>
      <span id="hourLabel">15:24</span>
      <input id="hour" type="range" min="0" max="24" step="0.05" value="15.4">
    </div>
    <div class="grp">
      <button class="btn tiny" data-hour="6.35">清晨</button>
      <button class="btn tiny" data-hour="12.0">正午</button>
      <button class="btn tiny" data-hour="17.75">黄金时刻</button>
      <button class="btn tiny" data-hour="21.4">夜晚</button>
      <button class="btn tiny" data-hour="23.6">深夜</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="lab">曝光</span>
      <input id="exposure" type="range" min="0.55" max="1.8" step="0.01" value="1">
      <span id="expLabel">1.00</span>
    </div>
    <div class="hint">拖动画面可自由环视 · 滚轮缩放<br>O 键开关自动环绕 · H 键隐藏面板</div>
  </div>
  <div class="row">
    <div class="grp">
      <span class="lab">开关</span>
      <button class="btn" data-toggle="orbit">自动环绕</button>
      <button class="btn" data-toggle="people">游客</button>
      <button class="btn" data-toggle="fountain">喷泉</button>
      <button class="btn" data-toggle="shadows">阴影</button>
      <button class="btn" data-toggle="bloom">泛光</button>
      <button class="btn" data-toggle="quality">高画质</button>
    </div>
  </div>
</div>

<div id="errs"></div>

<script>
  window.__ERRORS__ = [];
  function __show(v){
    window.__ERRORS__.push(v);
    var e = document.getElementById('errs');
    if (e){ e.style.display='block'; e.textContent = window.__ERRORS__.slice(-4).join('\n'); }
  }
  addEventListener('error', function(ev){ __show('ERR: ' + (ev.message || ev.error)); });
  addEventListener('unhandledrejection', function(ev){ __show('REJECT: ' + ev.reason); });
</script>
